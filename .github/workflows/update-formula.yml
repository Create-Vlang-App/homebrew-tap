name: Update formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 0.0.1)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and source tarball from GitHub Release
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$PAYLOAD_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version provided via workflow_dispatch or repository_dispatch payload" >&2
            exit 1
          fi
          TAG="create-vlang-app@${VERSION}"
          URL="https://github.com/Create-Vlang-App/create-vlang-app/archive/refs/tags/${TAG}.tar.gz"
          SHA=""
          for attempt in $(seq 1 24); do
            if curl -sfL "$URL" -o /tmp/cva-src.tgz; then
              SHA=$(sha256sum /tmp/cva-src.tgz | cut -d' ' -f1)
              if [ -n "$SHA" ]; then
                break
              fi
            fi
            echo "::warning::Release tarball not ready for ${TAG} (attempt ${attempt}/24); retrying in 15s"
            sleep 15
            SHA=""
          done
          rm -f /tmp/cva-src.tgz
          if [ -z "$SHA" ]; then
            echo "::error::Could not download or hash tarball at $URL" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "sha256=$SHA"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved v${VERSION}"
          echo "  url=$URL"
          echo "  sha256=$SHA"

      - name: Patch formula
        env:
          FORMULA_URL: ${{ steps.meta.outputs.url }}
          FORMULA_SHA: ${{ steps.meta.outputs.sha256 }}
          FORMULA_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s|url \".*\"|url \"${FORMULA_URL}\"|" Formula/create-vlang-app.rb
          sed -i "s|sha256 \".*\"|sha256 \"${FORMULA_SHA}\"|" Formula/create-vlang-app.rb
          sed -i "s|version \".*\"|version \"${FORMULA_VERSION}\"|" Formula/create-vlang-app.rb
          echo "----- Updated formula -----"
          cat Formula/create-vlang-app.rb

      - name: Open update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMULA_VERSION: ${{ steps.meta.outputs.version }}
          FORMULA_SHA: ${{ steps.meta.outputs.sha256 }}
          FORMULA_URL: ${{ steps.meta.outputs.url }}
        run: |
          set -euo pipefail
          BRANCH="release/${FORMULA_VERSION}"
          if gh pr list --head "$BRANCH" --state open --json number --jq -e '.[0].number' >/dev/null; then
            echo "Update PR already open for ${FORMULA_VERSION}; nothing to do"
            exit 0
          fi
          git config user.name "Create Vlang App Bot"
          git config user.email "ulisescf.24@gmail.com"
          git checkout -b "$BRANCH"
          git add Formula/create-vlang-app.rb
          git commit -m "feat: update formula to ${FORMULA_VERSION}"
          git push -u origin "$BRANCH"
          cat > /tmp/cva-pr-body.md <<PRBODY
          ## Description

          Automated formula update to ${FORMULA_VERSION} (${FORMULA_URL}, sha256 ${FORMULA_SHA}).

          ## Type of Change
          - [x] Formula update

          ## How Has This Been Tested?
          - [x] Version drift + tarball sha check in update run; Formula lint runs on this PR

          ## Checklist
          - [x] Self-review done
          - [x] Formula validated (brew audit --strict, brew style run in CI)
          PRBODY
          sed -i 's/^          //' /tmp/cva-pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "feat: update formula to ${FORMULA_VERSION}" \
            --body-file /tmp/cva-pr-body.md
