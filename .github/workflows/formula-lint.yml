---
name: Formula lint

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formula-lint:
    name: Formula lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Ruby syntax check on all formulas
        run: |
          set -euo pipefail
          find Formula -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Formulas declare a Formula class
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            grep -Eq '^class [A-Z][A-Za-z]+ < Formula' "$f" || {
              echo "::error::$f: no 'class ... < Formula' declaration found"
              exit 1
            }
          done
          echo "All formulas OK"

      - name: ShellCheck workflows
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          echo "ShellCheck version: $(shellcheck --version | head -1)"
          for wf in .github/workflows/*.yml; do
            echo "--- shellcheck $wf ---"
            shellcheck --severity=error --shell=bash \
              --exclude=SC2148,SC2034,SC2154 "$wf" || {
              echo "::warning::$wf has shellcheck errors"
            }
          done

      - name: Version drift check (GitHub Release)
        run: |
          set -euo pipefail
          FORMULA_VER=$(grep -E 'version "' Formula/*.rb | head -1 \
            | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          RELEASE_API=https://api.github.com/repos/
          RELEASE_API+="Create-Vlang-App/create-vlang-app/releases/latest"
          GH_TAG=$(curl -sfL "$RELEASE_API" | jq -r '.tag_name')
          GH_VER=${GH_TAG#create-vlang-app@}
          echo "Formula version: $FORMULA_VER"
          echo "GitHub latest tag: $GH_TAG (version $GH_VER)"
          if [ "$FORMULA_VER" != "$GH_VER" ]; then
            echo "::warning::Formula version ($FORMULA_VER) differs from" \
              "GitHub latest ($GH_VER)"
          else
            echo "Version sync OK: $FORMULA_VER"
          fi
          # Verify the Apple Silicon binary checksum.
          FORMULA_SHA=$(grep -E 'sha256 "' Formula/*.rb | head -1 \
            | grep -Eo '"[^"]+"' | tr -d '"')
          FORMULA_URL=$(grep -E 'url "' Formula/*.rb | head -1 \
            | grep -Eo '"[^"]+"' | tr -d '"')
          echo "Formula URL: $FORMULA_URL"
          echo "Formula sha256: $FORMULA_SHA"
          TMP=$(mktemp)
          curl -sfL "$FORMULA_URL" -o "$TMP"
          ACT_SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
          rm -f "$TMP"
          echo "Actual Apple Silicon asset sha256: $ACT_SHA"
          if [ "$FORMULA_SHA" != "$ACT_SHA" ]; then
            echo "::error::Apple Silicon checksum mismatch" >&2
            exit 1
          else
            echo "Apple Silicon SHA sync OK"
          fi

          # Verify the Intel binary checksum declared inside the on_intel block.
          INTEL_URL=$(grep -E '^    url "' \
            Formula/create-vlang-app.rb | sed -n '1p' | cut -d '"' -f2)
          INTEL_SHA=$(grep -E '^    sha256 "' \
            Formula/create-vlang-app.rb | sed -n '1p' | cut -d '"' -f2)
          echo "Intel URL: $INTEL_URL"
          echo "Intel sha256: $INTEL_SHA"
          curl -sfL "$INTEL_URL" -o "$TMP-intel"
          ACT_INTEL_SHA=$(sha256sum "$TMP-intel" | cut -d ' ' -f1)
          rm -f "$TMP-intel"
          echo "Actual Intel asset sha256: $ACT_INTEL_SHA"
          if [ "$INTEL_SHA" != "$ACT_INTEL_SHA" ]; then
            echo "::error::Intel checksum differs from release asset" >&2
            exit 1
          else
            echo "Intel SHA sync OK"
          fi

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Brew audit (strict)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Brew audit on taps requires formula name, not a path.
          # Tap the local repository if needed and audit by name
          brew tap Create-Vlang-App/tap || true
          brew update || true
          # Try online strict audit, then offline strict audit.
          FORMULA_NAME=Create-Vlang-App/tap/create-vlang-app
          if brew audit --strict --online "$FORMULA_NAME"; then
            :
          elif brew audit --strict "$FORMULA_NAME"; then
            :
          elif brew audit --strict --tap Create-Vlang-App/tap; then
            :
          else
            echo "::warning::brew audit found issues (informational)"
          fi
          echo "brew audit completed (informational)"

      - name: Brew style
        continue-on-error: true
        run: |
          set -euo pipefail
          brew style Formula/*.rb || {
            echo "::warning::brew style found issues (informational)"
          }
          echo "brew style completed (informational)"

  formula-smoke:
    name: Formula install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install formula from release binary
        run: |
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source \
            --formula ./Formula/create-vlang-app.rb

      - name: Run formula tests
        run: |
          set -euo pipefail
          brew test --verbose create-vlang-app
          create-vlang-app --version
          create-vlang-app --help | grep -q list-templates
